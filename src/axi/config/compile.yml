---
# AXI shared types and SystemVerilog interface (`axi_if`). Required by every
# in-tree AXI subordinate/manager component.
provides: [axi_pkg]
schema_version: 2.4.0
targets:
  tb:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/axi_pkg.sv
      - $COMPILE_ROOT/rtl/axi_if.sv
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/axi_pkg.sv
      - $COMPILE_ROOT/rtl/axi_if.sv
---
# Generic AXI subordinate adapter (read/write channels + arbiter + top
# wrapper). Used as the standard way to expose Caliptra register/memory
# blocks onto the AXI fabric.
provides: [axi_sub]
schema_version: 2.4.0
requires:
  - libs
  - axi_pkg
  - caliptra_prim_pkg
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/axi_addr.v
      - $COMPILE_ROOT/rtl/axi_sub_rd.sv
      - $COMPILE_ROOT/rtl/axi_sub_wr.sv
      - $COMPILE_ROOT/rtl/axi_sub_arb.sv
      - $COMPILE_ROOT/rtl/axi_sub.sv
    tops: [axi_sub]
---
# Thin AXI-attached SRAM wrapper built on top of axi_sub; used in testbenches
# and as a reusable memory endpoint in integrations.
provides: [caliptra_axi_sram]
schema_version: 2.4.0
requires:
  - libs
  - axi_sub
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/caliptra_axi_sram.sv
    tops: [caliptra_axi_sram]
---
# UVM register-model bundle for the AXI DMA. Single auto-generated UVM
# reg-model file kept separate from the RTL provider so testbenches can pull
# it in without dragging in the synthesizable AXI DMA implementation.
provides: [axi_dma_uvm_pkg]
schema_version: 2.4.0
requires: []
targets:
  tb:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/dv/reg_model/axi_dma_reg_uvm.sv
---
# AXI DMA RTL: request interface, generated register file, read/write
# managers, control FSM, and top wrapper. Used by soc_ifc/caliptra_top to
# move data between Caliptra-internal memory and external AXI endpoints.
provides: [axi_dma]
schema_version: 2.4.0
requires:
  - libs
  - caliptra_prim
  - axi_pkg
  - soc_ifc_pkg
  - kv_defines_pkg
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/axi_dma_req_if.sv
      - $COMPILE_ROOT/rtl/generated/axi_dma_reg_pkg.sv
      - $COMPILE_ROOT/rtl/generated/axi_dma_reg.sv
      - $COMPILE_ROOT/rtl/axi_mgr_rd.sv
      - $COMPILE_ROOT/rtl/axi_mgr_wr.sv
      - $COMPILE_ROOT/rtl/axi_dma_ctrl.sv
      - $COMPILE_ROOT/rtl/axi_dma_top.sv
    tops: [axi_dma_top]
  tb:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/generated/axi_dma_reg_pkg.sv
---
# Functional-coverage collateral bound onto axi_dma_top: cover interface,
# bind module, and SVA properties. Testbench-only.
provides: [axi_dma_coverage]
schema_version: 2.4.0
requires:
  - axi_dma
targets:
  tb:
    directories:
      - $COMPILE_ROOT/coverage
    files:
      - $COMPILE_ROOT/coverage/axi_dma_top_cov_if.sv
      - $COMPILE_ROOT/coverage/axi_dma_top_cov_bind.sv
      - $COMPILE_ROOT/coverage/axi_dma_top_cov_props.sv
