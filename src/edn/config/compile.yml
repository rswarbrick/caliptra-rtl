---
# SV package of OpenTitan EDN (Entropy Distribution Network) types. Used by
# every block that requests CSRNG-derived entropy via EDN req/ack handshakes.
# No EDN RTL is built in this tree — only the shared types are needed.
provides: [edn_pkg]
requires:
  - entropy_src_pkg
  - csrng_pkg
schema_version: 2.4.0
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/edn_pkg.sv
  tb:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/edn_pkg.sv

