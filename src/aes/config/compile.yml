---
# AES shared SV packages: OpenTitan aes_reg_pkg/aes_pkg, the Canright SBox
# pkg, and the Caliptra-specific aes_clp_reg_pkg generated wrapper. Imported
# by aes RTL and AES coverage/UVM consumers.
provides: [aes_pkg]
schema_version: 2.4.0
requires:
  - edn_pkg
  - caliptra_prim
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/aes_reg_pkg.sv
      - $COMPILE_ROOT/rtl/aes_pkg.sv
      - $COMPILE_ROOT/rtl/aes_sbox_canright_pkg.sv
      - $COMPILE_ROOT/rtl/generated/aes_clp_reg_pkg.sv
  tb:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/aes_reg_pkg.sv
      - $COMPILE_ROOT/rtl/aes_pkg.sv
      - $COMPILE_ROOT/rtl/aes_sbox_canright_pkg.sv
      - $COMPILE_ROOT/rtl/generated/aes_clp_reg_pkg.sv
---
# Auto-generated UVM register-model file for the AES block — composite RAL
# (OT core + Caliptra wrapper) generated from aes_dv_reg.rdl, plus the
# per-block covergroup and sample scaffolding it includes. Testbench-only.
provides: [aes_uvm_pkg]
schema_version: 2.4.0
# aes_dv_reg_uvm.sv extends dv_base_reg{,_block,_field} and imports
# dv_base_reg_pkg::*; anchor the FuseSoC core ahead of this fileset.
# (Compile-to-core passes through colon-bearing names verbatim — see the
# local compile-to-core-passthrough-vlnv patch.)
requires:
  - lowrisc:dv:dv_base_reg
targets:
  tb:
    directories: [$COMPILE_ROOT/dv/reg_model]
    files:
      - $COMPILE_ROOT/dv/reg_model/aes_dv_reg_uvm.sv
---
# Functional-coverage collateral bound onto the AES block. Testbench-only.
provides: [aes_coverage]
schema_version: 2.4.0
requires:
  - libs
  - aes_pkg
  - kv_defines_pkg
targets:
  tb:
    directories:
      - $COMPILE_ROOT/coverage
    files:
      - $COMPILE_ROOT/coverage/aes_cov_if.sv
      - $COMPILE_ROOT/coverage/aes_cov_bind.sv
---
# OpenTitan AES RTL plus the Caliptra wrapper (aes_clp_wrapper): cipher core,
# control FSMs (positive- and negative-polarity redundant variants), SBox
# implementations (LUT, DOM-masked, Canright, Canright-masked), key
# expansion, mix-columns, shift-rows, GCM, CTR, and PRNGs. Top is
# aes_clp_wrapper; tops field intentionally targets aes_cipher_core for lint.
provides: [aes]
schema_version: 2.4.0
requires:
  - aes_pkg
  - kv_defines_pkg
  - keyvault
  - caliptra_tlul_pkg
  - caliptra_top_reg_defines
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/aes_sbox_canright.sv
      - $COMPILE_ROOT/rtl/aes_sbox_canright_masked.sv
      - $COMPILE_ROOT/rtl/aes_cipher_core.sv
      - $COMPILE_ROOT/rtl/aes_sbox.sv
      - $COMPILE_ROOT/rtl/aes_cipher_control_fsm_n.sv
      - $COMPILE_ROOT/rtl/aes_cipher_control_fsm_p.sv
      - $COMPILE_ROOT/rtl/aes_sbox_lut.sv
      - $COMPILE_ROOT/rtl/aes_mix_columns.sv
      - $COMPILE_ROOT/rtl/aes_sbox_dom.sv
      - $COMPILE_ROOT/rtl/aes_sub_bytes.sv
      - $COMPILE_ROOT/rtl/aes_sbox_canright_masked_noreuse.sv
      - $COMPILE_ROOT/rtl/aes_sel_buf_chk.sv
      - $COMPILE_ROOT/rtl/aes_cipher_control_fsm.sv
      - $COMPILE_ROOT/rtl/aes_shift_rows.sv
      - $COMPILE_ROOT/rtl/aes_mix_single_column.sv
      - $COMPILE_ROOT/rtl/aes_cipher_control.sv
      - $COMPILE_ROOT/rtl/aes_prng_masking.sv
      - $COMPILE_ROOT/rtl/aes_key_expand.sv
      - $COMPILE_ROOT/rtl/aes_control.sv
      - $COMPILE_ROOT/rtl/aes_control_fsm.sv
      - $COMPILE_ROOT/rtl/aes_control_fsm_n.sv
      - $COMPILE_ROOT/rtl/aes_control_fsm_p.sv
      - $COMPILE_ROOT/rtl/aes_core.sv
      - $COMPILE_ROOT/rtl/aes_ctr.sv
      - $COMPILE_ROOT/rtl/aes_ctr_fsm.sv
      - $COMPILE_ROOT/rtl/aes_ctr_fsm_n.sv
      - $COMPILE_ROOT/rtl/aes_ctr_fsm_p.sv
      - $COMPILE_ROOT/rtl/aes_ctrl_gcm_reg_shadowed.sv
      - $COMPILE_ROOT/rtl/aes_ctrl_reg_shadowed.sv
      - $COMPILE_ROOT/rtl/aes_ghash.sv
      - $COMPILE_ROOT/rtl/aes_prng_clearing.sv
      - $COMPILE_ROOT/rtl/aes_reduced_round.sv
      - $COMPILE_ROOT/rtl/aes_reg_status.sv
      - $COMPILE_ROOT/rtl/aes_reg_top.sv
      - $COMPILE_ROOT/rtl/aes.sv
      - $COMPILE_ROOT/rtl/generated/aes_clp_reg.sv
      - $COMPILE_ROOT/rtl/aes_clp_wrapper.sv
    tops: [aes_cipher_core]
  rtl_lint:
    directories: []
    waiver_files: []
    tops: [aes_cipher_core]
