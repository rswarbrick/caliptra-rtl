---
# SV package (sha3_pkg) shared by the legacy KMAC/SHA3 sources under
# src/kmac/. Distinct from the OpenTitan-derived KMAC under src/sha3/, which
# provides its own kmac_pkg via the sha3_kmac provider.
provides: [kmac_pkg]
schema_version: 2.4.0
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/sha3_pkg.sv
---
# Legacy in-tree SHA3/Keccak primitives (keccak_round, keccak_2share, sha3pad,
# sha3). Predates the OpenTitan ot_sha3_prim sources under src/sha3/ and is
# kept available for consumers that still elaborate the older module set.
provides: [kmac]
schema_version: 2.4.0
requires:
  - kmac_pkg
  - caliptra_prim_pkg
  - lc_ctrl_pkg
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/keccak_round.sv
      - $COMPILE_ROOT/rtl/keccak_2share.sv
      - $COMPILE_ROOT/rtl/sha3pad.sv
      - $COMPILE_ROOT/rtl/sha3.sv
    tops: [sha3]
  rtl_lint:
    directories: []
    waiver_files: []
    tops: [sha3]
