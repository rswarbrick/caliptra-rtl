---
# Top-level SVA bound onto caliptra_top: the caliptra_top_sva property module
# plus the multi-IP kv_boot_flow_sva that watches the boot-time KeyVault
# key-transfer sequence. Testbench-only, depended on by caliptra_top_tb_pkg.
provides: [caliptra_top_asserts]
schema_version: 2.4.0
requires:
  - kv_defines_pkg
  - doe_defines_pkg
  - axi_dma
  - libs
  - caliptra_prim
targets:
  tb:
    directories: [$COMPILE_ROOT]
    files:
      - $COMPILE_ROOT/caliptra_top_sva.sv
      - $COMPILE_ROOT/kv_boot_flow_sva.sv
global:
  tool:
    vcs:
      default:
        - '-assert svaext'
        #- '-v2k_generate'
        #- '-timescale=1ns/1ps'
        - '-noinherit_timescale=1ns/1ps'
        #- '-ucli -i dump.ucli'
      #sim:
        #- '-ucli -i dump.ucli'
