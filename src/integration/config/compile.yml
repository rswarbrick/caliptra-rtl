---
# Top-level Verilog `defines header (config_defines.svh) controlling
# elaboration-time configuration of caliptra_top (memory sizes, RV core
# parameters, build-mode selectors). Pulled in everywhere `defines from this
# file are referenced.
provides: [caliptra_top_defines]
schema_version: 2.4.0
targets:
  tb:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/config_defines.svh
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/config_defines.svh
---
# Caliptra register-map defines header (caliptra_reg_defines.svh) — address
# constants and reg-offset macros for the standalone (non-subsystem) build.
# Sibling caliptra_top_reg_ss_defines is the subsystem-mode variant.
provides: [caliptra_top_reg_defines]
schema_version: 2.4.0
targets:
  tb:
    directories: [$COMPILE_ROOT/rtl/caliptra_reg]
    files:
      - $COMPILE_ROOT/rtl/caliptra_reg/caliptra_reg_defines.svh
  rtl:
    directories: [$COMPILE_ROOT/rtl/caliptra_reg]
    files:
      - $COMPILE_ROOT/rtl/caliptra_reg/caliptra_reg_defines.svh
---
# Caliptra register-map defines header for subsystem-mode builds (the
# caliptra_reg_ss directory variant). Selected in place of
# caliptra_top_reg_defines by caliptra_top_ss_mode.
provides: [caliptra_top_reg_ss_defines]
schema_version: 2.4.0
targets:
  tb:
    directories: [$COMPILE_ROOT/rtl/caliptra_reg_ss]
    files:
      - $COMPILE_ROOT/rtl/caliptra_reg_ss/caliptra_reg_defines.svh
  rtl:
    directories: [$COMPILE_ROOT/rtl/caliptra_reg_ss]
    files:
      - $COMPILE_ROOT/rtl/caliptra_reg_ss/caliptra_reg_defines.svh
---
# Shared owner of the caliptra_top integration RTL (caliptra_top.sv and the
# boot_flow_monitor). Aggregates every leaf IP block via `requires:` so the
# caliptra_top and caliptra_top_ss_mode variants only differ in their
# reg-defines and elaboration-time `+define+` set.
provides: [caliptra_top_rtl]
schema_version: 2.4.0
requires:
  - caliptra_top_defines
  - libs
  - kv_defines_pkg
  - pv_defines_pkg
  - dv_defines_pkg
  - el2_veer_pkg
  - el2_veer_wrapper
  - ahb_lite_bus
  - sha512_ctrl
  - sha256_ctrl
  - doe_ctrl
  - hmac_ctrl
  - ecc_top
  - abr_top
  - keyvault
  - pcrvault
  - datavault
  - soc_ifc_top
  - entropy_src
  - csrng
  - aes
  - sha3_ctrl
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/caliptra_top.sv
      - $COMPILE_ROOT/rtl/boot_flow_monitor.sv
---
# Default (standalone) caliptra_top elaboration variant: caliptra_top_rtl
# bound to the standalone reg-defines, with internal-TRNG and AXI DMA addr
# width selected via `+define+`. Used by lint and most non-subsystem flows.
provides: [caliptra_top]
schema_version: 2.4.0
requires:
  - caliptra_top_rtl
  - caliptra_top_reg_defines
targets:
  rtl:
    tops: [caliptra_top]
  rtl_lint:
    waiver_files:
      - $MSFT_REPO_ROOT/src/integration/config/design_lint/sglint_waivers
    options:
      - '+define+CALIPTRA_INTERNAL_TRNG'
      - '+define+CALIPTRA_AXI_DMA_ADDR_WIDTH=32'
      - '+define+RV_TOP=caliptra_top.rvtop'
  cdc:
    tcl_files:
      - $COMPILE_ROOT/config/cdc/integration_top.constraints.tcl
      - $COMPILE_ROOT/config/cdc/integration_top.waivers.tcl
global:
  tool:
    vcs:
      default:
        - '-assert svaext'
---
# Subsystem-mode caliptra_top elaboration variant: same RTL as caliptra_top
# but bound to caliptra_top_reg_ss_defines and built with
# +define+CALIPTRA_MODE_SUBSYSTEM. Used in SoC subsystem integrations.
provides: [caliptra_top_ss_mode]
schema_version: 2.4.0
requires:
  - caliptra_top_rtl
  - caliptra_top_reg_ss_defines
targets:
  rtl:
    tops: [caliptra_top]
  rtl_lint:
    waiver_files:
      - $MSFT_REPO_ROOT/src/integration/config/design_lint/sglint_waivers
    options:
      - '+define+CALIPTRA_INTERNAL_TRNG'
      - '+define+CALIPTRA_AXI_DMA_ADDR_WIDTH=32'
      - '+define+RV_TOP=caliptra_top.rvtop'
  cdc:
    tcl_files:
      - $COMPILE_ROOT/config/cdc/integration_top.constraints.tcl
      - $COMPILE_ROOT/config/cdc/integration_top.waivers.tcl
global:
  tool:
    vcs:
      default:
        - '+define+CALIPTRA_MODE_SUBSYSTEM'
        - '+define+CALIPTRA_INTERNAL_TRNG'
        - '-assert svaext'
---
# Shared caliptra_top testbench infrastructure: TB packages, DPI C sources
# (TCP server for firmware co-sim, JTAG DPI), DMA transfer generator, VeeR
# SRAM export, services/BFM/AXI-complex helpers, the caliptra_top cover
# binds, and every IP coverage provider. An umbrella for all
# caliptra_top_tb* variants.
provides: [caliptra_top_tb_pkg]
schema_version: 2.4.0
requires:
  - caliptra_top_asserts
  - axi_pc
  - libs
  - caliptra_axi_sram
  - el2_veer_pkg
  - el2_veer_wrapper
  - physical_rng
  - sha512_coverage
  - sha256_coverage
  - hmac_coverage
  - hmac_drbg_coverage
  - ecc_coverage
  - soc_ifc_coverage
  - pcrvault_coverage
  - keyvault_coverage
  - clp_abr_coverage
  - axi_dma_coverage
  - aes_coverage
  - doe_coverage
targets:
  dpi_compile:
    directories:
      - $COMPILE_ROOT/test_suites/libs/tcp_server
      - $COMPILE_ROOT/test_suites/libs/jtagdpi
    files:
      - $COMPILE_ROOT/test_suites/libs/tcp_server/tcp_server.h
      - $COMPILE_ROOT/test_suites/libs/tcp_server/tcp_server.c
      - $COMPILE_ROOT/test_suites/libs/jtagdpi/jtagdpi.h
      - $COMPILE_ROOT/test_suites/libs/jtagdpi/jtagdpi.c
    options:
      - '-Wno-unused-variable'
      - '-Wno-unused-function'
      - tool:
          vcs:
            - '-DVCS'
          ius:
            - '-DXCELIUM'
  tb:
    directories: #[$COMPILE_ROOT/tb]
      - $COMPILE_ROOT/tb
      - $COMPILE_ROOT/coverage
    files:
#      - $COMPILE_ROOT/tb/dma_transfer_randomizer.sv
      - $COMPILE_ROOT/tb/caliptra_top_tb_pkg.sv
      - $COMPILE_ROOT/tb/dma_testcase_generator.sv
      - $COMPILE_ROOT/tb/caliptra_veer_sram_export.sv
      - $COMPILE_ROOT/tb/caliptra_top_tb_services.sv
      - $COMPILE_ROOT/tb/caliptra_top_tb_soc_bfm.sv
      - $COMPILE_ROOT/tb/caliptra_top_tb_axi_complex.sv
      - $COMPILE_ROOT/tb/caliptra_top_tb_axi_fifo.sv
      - $COMPILE_ROOT/coverage/caliptra_top_cov_if.sv
      - $COMPILE_ROOT/coverage/caliptra_top_cov_props.sv
      - $COMPILE_ROOT/coverage/caliptra_top_cov_bind.sv
      - $COMPILE_ROOT/test_suites/libs/jtagdpi/jtagdpi.sv
---
# Shared owner of the caliptra_top_tb top-level SV. Consumed by the
# caliptra_top_tb / caliptra_top_trng_tb / caliptra_top_ss_mode_tb variants,
# which differ only in their caliptra_top* dependency and elaboration-time
# +define+ set.
provides: [caliptra_top_tb_rtl]
schema_version: 2.4.0
requires:
  - caliptra_top_tb_pkg
targets:
  tb:
    directories:
      - $COMPILE_ROOT/tb
    files:
      - $COMPILE_ROOT/tb/caliptra_top_tb.sv
---
# Default caliptra_top testbench variant: caliptra_top DUT (standalone reg
# defines) + the shared caliptra_top_tb_rtl. The pre_exec block stages
# vector-generation binaries/scripts (ECC, DOE, SHA256-wntz, MLDSA, ML-KEM)
# into the run dir so the testbench can self-check against fresh vectors.
provides: [caliptra_top_tb]
schema_version: 2.4.0
requires:
  - caliptra_top
  - caliptra_top_tb_rtl
targets:
  tb:
    tops: [caliptra_top_tb]
  sim:
    pre_exec: |
        $MSFT_SCRIPTS_DIR/run_test_makefile
        echo "[PRE-EXEC] Copying ECC vector generator to ${pwd}"
        cp $COMPILE_ROOT/../ecc/tb/ecc_secp384r1.exe .

        echo "[PRE-EXEC] Copying DOE vector generator to ${pwd}"
        cp $COMPILE_ROOT/../doe/tb/doe_test_gen.py .

        echo "[PRE-EXEC] Copying SHA256 wntz vector generator to ${pwd}"
        cp $COMPILE_ROOT/../sha256/tb/sha256_wntz_test_gen.py .

        echo "[PRE-EXEC] Copying MLDSA vector generator to ${pwd}"
        cp $COMPILE_ROOT/../../submodules/adams-bridge/src/abr_top/uvmf/Dilithium_ref/dilithium/ref/test/test_dilithium5 .

        echo "[PRE-EXEC] Copying MLDSA debug vector generator to ${pwd}"
        cp $COMPILE_ROOT/../../submodules/adams-bridge/src/abr_top/uvmf/Dilithium_ref/dilithium/ref/test/test_dilithium5_debug .

        echo "[PRE-EXEC] Copying mldsa directed vector to ${pwd}"
        cp $COMPILE_ROOT/../mldsa/tb/smoke_test_mldsa_vector.hex .

        echo "[PRE-EXEC] Copying ML-KEM python vector generator to ${pwd}"
        mkdir -p ml-kem/tv
        cp $COMPILE_ROOT/../../submodules/adams-bridge/src/abr_top/uvmf/ML_KEM_ref/ml-kem/random_test_ml_kem.py ml-kem/
        cp $COMPILE_ROOT/../../submodules/adams-bridge/src/abr_top/uvmf/ML_KEM_ref/ml-kem/ml_kem.py ml-kem/
        cp $COMPILE_ROOT/../../submodules/adams-bridge/src/abr_top/uvmf/ML_KEM_ref/ml-kem/Module.py ml-kem/
        cp $COMPILE_ROOT/../../submodules/adams-bridge/src/abr_top/uvmf/ML_KEM_ref/ml-kem/utils.py ml-kem/

    post_exec: 'if [[ -f ./cm.log ]]; then rm ./cm.log; else echo "Did not find cm.log"; fi'

global:
  tool:
    vcs:
      default:
        - '-assert svaext'
#        - '+define+CALIPTRA_INTERNAL_TRNG'
        - +define+CALIPTRA_TOP_TB
        - +define+CALIPTRA_TOP=caliptra_top_tb
        - +define+RV_TOP=caliptra_top_tb.caliptra_top_dut.rvtop
        - +define+CLP_ASSERT_ON
        - +define+ABR_ASSERT_ON
        - +define+SIMULATION
        #- '-v2k_generate'
        #- '-timescale=1ns/1ps'
        - '-noinherit_timescale=1ns/1ps'
        #- '-ucli -i dump.ucli'
      #sim:
        #- '-ucli -i dump.ucli'
      elab:
        # Suppress "Bit Size Exceeded" warning.
        # VCS flags this during elab for ram signals (found under
        # caliptra_top_tb_services) that are too large to collect
        # coverage on.
        # We don't want coverage on these, so disable the warning.
        - '-suppress=VCM-BSZEX'
        # Suppress warning about unmatched wildcard patterns in
        # coverage configuration file.
        # This warning is erroneous in some cases (particularly for
        # nested struct signals in generated reg files), and the
        # targeted signal (with +/-node) is ultimately represented
        # correctly in the output vdb.
        - '-suppress=VCM-HFUFR'
---
