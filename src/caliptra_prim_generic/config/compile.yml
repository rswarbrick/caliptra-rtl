---
# Technology-generic implementations of the caliptra_prim primitive cells
# (flops, buffers, RAMs, gates, clock muxes/inverters). Substituted out for
# foundry-specific cells in synthesis; used as-is for simulation.
provides: [caliptra_prim_generic]
schema_version: 2.4.0
requires:
  - caliptra_prim_pkg
targets:
  rtl:
    directories: [$COMPILE_ROOT/rtl]
    files:
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_flop_en.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_flop.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_buf.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_ram_1p.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_and2.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_clock_mux2.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_clock_inv.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_xor2.sv
      - $COMPILE_ROOT/rtl/caliptra_prim_generic_xnor2.sv
